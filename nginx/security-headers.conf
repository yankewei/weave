# Shared browser hardening. nginx drops inherited add_header directives as soon
# as a location declares its own, so include this file in those locations too.
#
# HSTS is deliberately absent: this config listens on plain HTTP and may sit
# behind a TLS terminator. Enable Strict-Transport-Security at that terminator
# once the public origin is HTTPS.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

# The SPA loads only same-origin assets. style-src needs unsafe-inline for the
# style attributes React, dnd-kit and Tiptap write; script-src stays strict.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;
