# nginx is the only public entry point. It serves the web SPA and routes /api:
# the AMPHP `api` serves every browser API endpoint.

upstream api {
    server api:8080;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    # Uploads are capped at 4 MB by the app; leave room for multipart overhead.
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Agent callbacks are reachable only on the private API listener.
    location ^~ /internal/ {
        return 404;
    }

    # Every browser API request is served by PHP.
    location /api/ {
        proxy_pass http://api;
    }

    # A subscription is separate from submitting an input.
    location ~ ^/api/conversations/[^/]+/events$ {
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_pass http://api;
    }

    # Vite fingerprints everything under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client routes all load the SPA shell, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
