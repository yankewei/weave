# nginx is the only public entry point. It serves the web SPA and routes /api:
# the AMPHP `api` serves every browser API endpoint.

upstream api {
    server api:8080;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    # Uploads are capped at 4 MB by the app; leave room for multipart overhead.
    client_max_body_size 5m;

    # Compress text assets and JSON. text/event-stream must stay uncompressed,
    # otherwise a proxy can buffer the SSE snapshots.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Agent callbacks are reachable only on the private API listener.
    location ^~ /internal/ {
        return 404;
    }

    # Every browser API request is served by PHP.
    location /api/ {
        proxy_pass http://api;
    }

    # A subscription is separate from submitting an input.
    location ~ ^/api/conversations/[^/]+/events$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_pass http://api;
    }

    # Vite fingerprints everything under /assets.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client routes all load the SPA shell, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
