# nginx is the only public entry point. It serves the web SPA and routes /api:
# endpoints already migrated go to the AMPHP `api`, the rest to `legacy` (Next).

upstream api {
    server api:8080;
}

upstream legacy {
    server legacy:3000;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    # Uploads are capped at 4 MB by the app; leave room for multipart overhead.
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/health {
        proxy_pass http://api;
    }

    location /api/ {
        # The conversation endpoint streams server-sent events.
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_pass http://legacy;
    }

    # Vite fingerprints everything under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client routes all load the SPA shell, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
