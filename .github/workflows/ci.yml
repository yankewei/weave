name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pcntl, pgsql
          tools: composer:v2
      - run: pnpm install --frozen-lockfile
      - run: composer install --working-dir=api --no-interaction --no-progress
      - run: pnpm check
