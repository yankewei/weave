name: weave

# `docker compose up --build` starts the whole app behind nginx.
# Only nginx (and postgres, for local tools) is published on the host.

services:
  # Serves the web SPA and routes /api to legacy or api.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      - api
      - legacy

  # Next Route Handlers that still serve /api until the AMPHP API replaces them.
  legacy:
    build:
      context: .
      dockerfile: legacy/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_ORIGIN: http://localhost:${WEB_PORT:-8080}
      TRUSTED_PROXY_HOPS: 1
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AGENT_URL: http://agent:8090
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_started

  # Internal only: the API is its single caller.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
    volumes:
      - agent_data:/data

  # Applies migrations/ inside the compose network on every `up`, then exits.
  # Re-run after adding a migration with `pnpm db:migrate`.
  migrate:
    build:
      context: .
      dockerfile: legacy/Dockerfile
      target: migrate
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  agent_data:
