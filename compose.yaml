name: weave

# `docker compose up --build` starts the whole app behind nginx.
# Only nginx (and postgres and rustfs, for local tools and tests) is published on the host.

services:
  # Serves the web SPA and routes every /api request to PHP.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      - api

  api:
    build: api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AGENT_URL: http://agent:8090
      APP_ORIGIN: http://localhost:${WEB_PORT:-8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUSTED_PROXY_HOPS: 1
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-weave-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_started
      rustfs:
        condition: service_healthy

  # Internal only: the API is its single caller.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      AGENT_API_URL: http://api:8080
      CMD_API_KEY: ${CMD_API_KEY:-}
      CMD_MODEL: ${CMD_MODEL:-}
    volumes:
      - agent_data:/data

  # Applies migrations/ inside the compose network on every `up`, then exits.
  # Re-run after adding a migration with `pnpm db:migrate`.
  migrate:
    build:
      context: .
      dockerfile: migrate/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  # The default image store (ADR 0003). The API creates its bucket on start.
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:9000/health
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  agent_data:
  rustfs_data:
